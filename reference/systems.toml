# The systems that recipes can use.
#
# For systems in this repository (`in_repository = true`) the `system_version` of a reproduction is
# the commit (HEAD, on a clean working tree) at which it ran: `git checkout <system_version>` and
# `uv sync` reproduce it. The interpreter and compiler versions are recorded in the event's
# `toolchain`. This requires merging pull requests with merge commits (no squash or rebase merges),
# so that recorded branch commits stay in main's history. External systems record their own version.

[arithkit_toy]
description = "The toy implementation (python/arithkit_toy)."
in_repository = true

[arithkit]
description = "The native implementation (Rust, through python/arithkit)."
in_repository = true

[sage]
description = "SageMath, run by crosscheck/sage/run.py in the conda env `sage`; version is Sage's version string."

[magma]
description = "Magma, run by crosscheck/magma/run.py (magma -n on PATH); version is Magma's version (e.g. 2.30-1)."
